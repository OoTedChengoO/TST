<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影片快捷導航</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    header p {
      color: var(--sub);
      font-size: 0.9rem;
    }

    .search-bar {
      margin-top: 16px;
      display: flex;
      justify-content: center;
    }

    .search-input {
      width: 100%;
      max-width: 420px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: var(--card-bg);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .poster-box {
      width: 100%;
      height: 180px;
      background-color: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card:hover .play-overlay {
      opacity: 1;
    }

    .play-icon {
      width: 44px;
      height: 44px;
      fill: #fff;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
    }

    .card-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tag {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .link-text {
      font-size: 0.75rem;
      color: var(--sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

    const grid = document.getElementById("links-grid");
    const uniqueLinks = [...new Set(links)];

    function renderCards(list) {
      grid.innerHTML = "";
      list.forEach(url => {
        const code = url.split("/").filter(Boolean).pop().toLowerCase();
        const posterUrl = `https://fourhoi.com/${code}/cover-n.jpg`;

        const card = document.createElement("a");
        card.href = url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.className = "card";

        card.innerHTML = `
          <div class="poster-box" style="background-image: url('${posterUrl}');">
            <div class="play-overlay">
              <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div class="card-info">
            <span class="tag">${code}</span>
            <span class="link-text">${url}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    renderCards(uniqueLinks);

    // 即時關鍵字搜尋功能
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = uniqueLinks.filter(url => {
        const code = url.split("/").filter(Boolean).pop().toLowerCase();
        return code.includes(query) || url.toLowerCase().includes(query);
      });
      renderCards(filtered);
    });
